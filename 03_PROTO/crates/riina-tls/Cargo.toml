# crates/riina-tls/Cargo.toml
# RIINA TLS 1.3 record protection — REAL AEAD over the verified sockets.
#
# Law 8 (zero third-party RUNTIME deps) holds: the ONLY dependency is
# first-party `riina-core` (05_TOOLING), whose crypto is std-only, KAT-tested,
# and carries the nine Coq⇄Rust formal-equivalence proofs + the constant-time
# certification. A path dependency to it is marked `workspace`/internal by the
# SBOM (cargo reports no `source`), so `sbom/riina-proto.cdx.json`'s
# 0-external-runtime-deps headline stays true. We depend on the PROVEN crypto
# rather than copying it, so the proofs stay attached to the running code.
[package]
name = "riina-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RIINA TLS 1.3 record protection over verified sockets"

[dependencies]
riina-core = { path = "../../../05_TOOLING/crates/riina-core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }
