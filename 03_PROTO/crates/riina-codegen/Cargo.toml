[package]
name = "riina-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = """
RIINA Code Generator
====================
Translates typed RIINA AST to executable representation.
Maintains formal correspondence with Coq specification.

RIINA = Rigorous Immutable Invariant, No Assumptions

Architecture: Custom IR → Reference Interpreter / C Emission
Mode: Comprehensive Verification | Zero Trust
"""

[dependencies]
# Internal dependencies - AST definitions
riina-types.workspace = true
# Actor runtime (JALINAN Phase 6)
riina-runtime = { path = "../riina-runtime" }
# Verified VirtualFs access-control model (exposed via the vfs_* builtins)
riina-os = { path = "../riina-os" }
riina-tls = { path = "../riina-tls" }

# No external dependencies (Law 8: Zero third-party deps)
# All code generation is hand-written for maximum auditability

[dev-dependencies]
# Testing dependencies (internal only)
riina-parser = { path = "../riina-parser" }
riina-typechecker = { path = "../riina-typechecker" }

# No feature flags - ZERO LAZINESS means we include EVERYTHING
# All backends (interpreter, C emission) are always available

# Verified-stdlib micro-benchmarks (Gate C / Gate E). `harness = false` means
# the bench provides its own `fn main()` — a hand-written timing loop — so NO
# third-party benchmarking crate is pulled in (Law 8 holds for 03_PROTO).
[[bench]]
name = "stdlib_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# Pedantic rules - allow some common patterns
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
use_self = "allow"
missing_const_for_fn = "allow"
redundant_else = "allow"
implicit_hasher = "allow"
