# RIINA Prototype Workspace
# Track B: Compiler Implementation
# RIINA = Rigorous Immutable Invariant, No Assumptions

[workspace]
resolver = "2"
members = [
    "crates/riina-arena",
    "crates/riina-codegen",
    "crates/riina-doc",
    "crates/riina-fmt",
    "crates/riina-lexer",
    "crates/riina-lsp",
    "crates/riina-parser",
    "crates/riina-span",
    "crates/riina-symbols",
    "crates/riina-typechecker",
    "crates/riina-types",
    "crates/riina-compliance",
    "crates/riina-pkg",
    "crates/riina-wasm",
    "crates/riina-runtime",
    "crates/riinac",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.84.0"
license = "Proprietary"
repository = "https://github.com/ib823/riina"

[workspace.dependencies]
# Internal dependencies - Foundation crates (P0)
riina-arena = { path = "crates/riina-arena" }
riina-span = { path = "crates/riina-span" }
riina-symbols = { path = "crates/riina-symbols" }

# Internal dependencies - Compiler crates
riina-lexer = { path = "crates/riina-lexer" }
riina-parser = { path = "crates/riina-parser" }
riina-types = { path = "crates/riina-types" }
riina-codegen = { path = "crates/riina-codegen" }
riina-compliance = { path = "crates/riina-compliance" }
riina-doc = { path = "crates/riina-doc" }
riina-fmt = { path = "crates/riina-fmt" }
riina-lsp = { path = "crates/riina-lsp" }
riina-pkg = { path = "crates/riina-pkg" }
riina-runtime = { path = "crates/riina-runtime" }
riina-typechecker = { path = "crates/riina-typechecker" }
riina-wasm = { path = "crates/riina-wasm" }

# No external dependencies (Law 8)

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
