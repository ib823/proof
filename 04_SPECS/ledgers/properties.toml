# Source of PROPERTY_LEDGER.md (REQ-103; mandate §2).
#
# One [[property]] per security or correctness property a public surface
# advertises. `level` is exactly one of the mandate's seven claim levels:
#   PROVEN-IMPL      proven for (or validated on every run of) the shipped riinac
#   PROVEN-MODEL     Coq theorem, closed under the global context, about the
#                    formal model; linked to the compiler only by testing
#   ENFORCED-TESTED  the compiler rejects violations; positive and negative tests
#   MODELLED         a formal model of X proving facts about its own definitions
#   GENERATED        produced by a script, not independently checked
#   RETIRED          no longer maintained
#   PLANNED          not built
# `theorem` names a HEADLINE_THEOREMS.md entry (PROVEN-MODEL rows must), and
# every path in `tests` must exist; scripts/generate-ledgers.py checks both.

[[property]]
id = "type-safety"
property = "Type safety: well-typed programs do not get stuck"
level = "PROVEN-MODEL"
fragment = "Full core calculus (27 constructors)"
theorem = "type_safety"
tests = ["03_PROTO/crates/riina-typechecker/src/tests.rs"]
command = "riinac verify --coq"

[[property]]
id = "effect-soundness"
property = "Effect soundness: evaluation stays within the declared effect"
level = "PROVEN-MODEL"
fragment = "Full core calculus"
theorem = "effect_sound_multi_step_declared"
tests = ["03_PROTO/crates/riina-typechecker/src/tests.rs"]
command = "riinac verify --coq"

[[property]]
id = "effect-checking"
property = "The compiler rejects effects a function does not declare"
level = "ENFORCED-TESTED"
fragment = "The shipped language"
theorem = ""
tests = ["03_PROTO/crates/riina-typechecker/src/tests.rs", "03_PROTO/crates/riinac/tests/end_to_end.rs"]
command = "cargo test -p riina-typechecker"

[[property]]
id = "noninterference-model"
property = "Non-interference: secret inputs do not change observable results"
level = "PROVEN-MODEL"
fragment = "Reference-free, fix-free core only (REQ-89 extends it)"
theorem = "ref_free_noninterference"
tests = []
