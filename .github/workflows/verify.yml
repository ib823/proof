# RIINA verification CI
#
# Runs the repository's OWN verification commands (the same ones documented in
# CLAUDE.md and RIINA_MASTER_PLAN.md Part 11) so the public claims in
# website/public/metrics.json and PROOF_STATUS.md cannot silently drift.
#
# Jobs are independent; each maps to a gate-relevant invariant:
#   rust-proto / rust-tooling -> "build: passing" + the 2,579-test claim
#   docs-audit                -> scripts/audit-docs.sh (metrics vs docs parity)
#   coq                       -> Admitted=0 / Axiom=0 in the active _CoqProject set
#
# NOTE: CLAUDE.md historically forbade external CI ("RIINA uses `riinac verify`
# internally"). This workflow was added at the repository owner's explicit
# direction; it wraps the internal verification rather than replacing it. If the
# policy is reaffirmed, delete this file. See assessment thread for context.

name: verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The tree-walking interpreter (`riina-codegen`) recurses on the native call
# stack; in debug builds its single large `eval` match makes each frame big, so
# the recursive tests need more than the default 2 MiB test-thread stack. CI runs
# `cargo test --manifest-path 03_PROTO/...` from the repo root, which does NOT
# discover `03_PROTO/.cargo/config.toml` (cargo reads config from the CWD, not the
# manifest path), so set the same value here. Mirrors that config; no semantic
# change to what is tested.
env:
  RUST_MIN_STACK: "67108864"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scheduling only — decides whether the 13-minute Coq job needs to run for
  # this event. It NEVER changes what is verified: every push to main (and any
  # manual dispatch) rebuilds the full active _CoqProject set unconditionally,
  # so the authoritative lane is untouched. On a pull request the corpus is
  # rebuilt only when something that can affect it actually changed. Measured
  # 2026-08-02: the Coq job is ~14 of the ~26 billable minutes per run, and a
  # docs- or Rust-only commit was paying all 14 for a bit-identical result.
  changes:
    name: Detect Coq-affecting changes
    runs-on: ubuntu-latest
    outputs:
      coq: ${{ steps.filter.outputs.coq }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request ($EVENT) — building the Coq corpus unconditionally."
            echo "coq=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything that can change the proof corpus, the active file set, the
          # ledger/warning gates, or this workflow itself forces a rebuild.
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE \
               '^02_FORMAL/coq/|^scripts/(update-proof-ledger|audit-coq-warnings)|^\.github/workflows/'; then
            echo "Coq-affecting paths changed — building."
            echo "coq=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Coq-affecting paths changed — skipping the corpus rebuild."
            echo "coq=false" >> "$GITHUB_OUTPUT"
          fi

  rust-proto:
    name: Rust tests (03_PROTO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "03_PROTO -> target"
      - name: cargo test --all
        run: cargo test --all --manifest-path 03_PROTO/Cargo.toml

  rust-tooling:
    name: Rust tests (05_TOOLING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "05_TOOLING -> target"
      - name: cargo test --all
        run: cargo test --all --manifest-path 05_TOOLING/Cargo.toml

  fuzz-robustness:
    name: Fuzz robustness (REQ-30 harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "03_PROTO -> target"
      # Thin wrapper over the in-repo REQ-30 harness
      # (03_PROTO/crates/riinac/tests/fuzz_robustness.rs) — the exact suite
      # plain `cargo test` runs (lexer → parser → typechecker → interpreter
      # pipeline fuzz), surfaced as its own required job so a fuzz regression
      # is named in the checks UI. No CI-divergent checks.
      - name: fuzz_robustness (full-pipeline fuzz)
        run: cargo test --manifest-path 03_PROTO/Cargo.toml -p riinac --test fuzz_robustness

  frontend-coverage:
    name: Frontend coverage gate (REQ-30, >=80% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "03_PROTO -> target"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # Thin wrapper over the in-repo gate (scripts/coverage-check.sh): line
      # coverage of the untrusted-input frontend (lexer+parser+typechecker, the
      # REQ-30 fuzz target) must stay >=80%. The script is the source of truth;
      # CI just runs it. No CI-divergent check.
      - name: scripts/coverage-check.sh
        run: bash scripts/coverage-check.sh 80

  sbom-freshness:
    name: SBOM freshness (REQ-31)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      # Thin wrapper over the repo's own drift guard: regenerates the
      # CycloneDX SBOMs from cargo metadata and fails if sbom/*.cdx.json is
      # stale (the shipped-compiler SBOM is the machine-checkable proof of
      # the zero-external-runtime-deps claim).
      - name: scripts/generate-sbom.sh --check
        run: bash scripts/generate-sbom.sh --check

  docs-audit:
    name: Docs / metrics parity (audit-docs.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # audit-docs.sh uses git history
      - name: scripts/audit-docs.sh
        run: bash scripts/audit-docs.sh

  coq:
    name: Coq active build (Rocq 9.1.1)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.coq == 'true'
    steps:
      - uses: actions/checkout@v4
      # NOT CACHED, deliberately. Measured 2026-08-02: of this job's ~13m,
      # `opam install rocq` is ~4m35s of pinned-toolchain reinstall that looks
      # like an obvious cache target. Two attempts (an `actions/cache` on
      # ~/.opam, then on ~/.opam + _opam) failed to make it collapse, and the
      # saved archive was only ~34 MB — far too small for a real Rocq switch,
      # so the cached path was wrong. Reverted rather than tuned blindly. The
      # `changes` gate above is the bigger win anyway: it skips this whole job.
      # If you retry, verify with a WARM cache (a populate run proves nothing)
      # and confirm `opam var root` actually points at what you cached.
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      # The corpus uses `From Stdlib`, so it requires the Rocq 9.x prover, not
      # legacy Coq 8.x. If the exact package name/version differs in the opam
      # repo, pin it here to match the toolchain in CLAUDE.md (Rocq 9.1.1).
      # On a cache hit this is a fast no-op; on a miss it installs as before.
      - name: Install Rocq 9.1.1
        run: |
          opam install -y rocq-prover.9.1.1 rocq-stdlib.9.1.1 || \
          opam install -y rocq-prover rocq-stdlib
      - name: make (active _CoqProject set)
        run: opam exec -- make -C 02_FORMAL/coq

  differential:
    name: WASM/C differential (byte-equality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "03_PROTO -> target"
      # `cc` ships on ubuntu-latest; `wasmtime` is the WASM runtime the
      # differential harness shells out to. With both present the
      # `corpus_differential` test actually runs (it auto-skips otherwise),
      # asserting byte-for-byte identical stdout from the C and WASM backends
      # across the dual-backend example corpus.
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Toolchain present (cc + wasmtime)
        run: cc --version && wasmtime --version
      - name: corpus_differential (C vs WASM stdout)
        run: cargo test -p riinac --test corpus_differential --manifest-path 03_PROTO/Cargo.toml -- --nocapture

  ct-structural:
    name: Constant-time structural (ctgrind / valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "05_TOOLING -> target"
      # The structural CT check is DETERMINISTIC (valgrind secret-poisoning, not
      # timing), so it is meaningful on a normal hosted runner. It asserts no
      # secret-dependent branch / memory access in AES / ct_eq / X25519 / Ed25519
      # (self-tested: a positive control must be detected, baseline must be clean)
      # and fails the build on any regression. This wraps the repo's own gate
      # (scripts/ct-structural-check.sh); it does not add a divergent check.
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: scripts/ct-structural-check.sh
        run: bash scripts/ct-structural-check.sh
