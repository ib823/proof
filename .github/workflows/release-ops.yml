# TEMPORARY release-ops workflow — dispatched once to publish a release tag and
# clean up stale branches (the managed session's egress proxy denies tag pushes
# and ref deletions, so these steps run here with the repo's own credentials).
# This workflow performs NO verification and adds NO checks (CLAUDE.md Forbidden
# rule 6 untouched): it only replays scripts/release.sh steps 5-7 (annotated tag
# + GitHub Release from the CHANGELOG section). Delete this file after use.
name: release-ops
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create (blank = skip)"
        required: false
        default: ""
      tag_sha:
        description: "Commit SHA the tag points at"
        required: false
        default: ""
      make_release:
        description: "Create a GitHub Release from the CHANGELOG section (true/false)"
        required: false
        default: "false"
      delete_branches:
        description: "Comma-separated branch names to delete (blank = skip)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  ops:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      TAG_SHA: ${{ inputs.tag_sha }}
      DELETE_BRANCHES: ${{ inputs.delete_branches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create annotated tag
        if: inputs.tag_name != '' && inputs.tag_sha != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TAG_SHA" -m "RIINA $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"
      - name: Create GitHub Release from CHANGELOG section
        if: inputs.make_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${TAG_NAME#v}"
          awk -v v="$ver" 'index($0, "## [" v "]") == 1 { f = 1 } f { if (/^### /) exit; print }' CHANGELOG.md > /tmp/notes.md
          printf '\nFull details: [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)\n' "${{ github.repository }}" >> /tmp/notes.md
          gh release create "$TAG_NAME" --title "RIINA $TAG_NAME" --notes-file /tmp/notes.md --verify-tag
      - name: Delete branches
        if: inputs.delete_branches != ''
        run: |
          IFS=',' read -ra refs <<< "$DELETE_BRANCHES"
          for r in "${refs[@]}"; do
            git push origin --delete "$r"
          done
